# Open Sesame — hardware & tuning configuration
#
# Parsed at build time by build.rs → compiled as constants (zero runtime cost).
# After editing, `cargo build` will pick up changes automatically.

[pins]
factory_reset = 0
toggle        = 1      # Door toggle button — active-low, internal pull-up
motor_in1     = 7      # DRV8874 IN1/EN — LEDC PWM channel 0
motor_in2     = 44     # DRV8874 IN2/PH — digital direction
motor_nslp    = 43     # DRV8874 nSLP   — active-high enable
enc_a         = 8      # Quadrature encoder channel A
enc_b         = 9      # Quadrature encoder channel B
led           = 21     # On-board status LED (active-high)

[motor]
pwm_freq_hz = 20_000   # Above audible range
mode        = "PhEn"   # "PhEn" or "InIn" — must match hardware MODE pin
min_duty    = 30       # Minimum PWM to overcome motor stiction (0–255)
max_duty    = 100      # Maximum PWM to control speed

[door]
dead_zone                   = 4       # Encoder counts/cycle below which door is "stationary", used for assisted motion
assist_velocity_threshold   = 7.5     # Encoder counts/cycle which the assisted door open/close feature will activate
lpf_alpha                   = 0.65    # Low-pass filter weight for velocity (0.0–1.0)
idle_timeout_ms             = 800     # No-motion duration before sleeping motor
endstop_closed              = 0       # Encoder count at fully-closed position
endstop_open                = 12_000  # Encoder count at fully-open position
endstop_ramp_counts         = 500     # Counts before endstop where power ramps down
operating_power             = 180     # PWM duty for normal operations (0–max_duty)
calibrate_power             = 120     # PWM duty during auto endstop calibration (lower = gentler)
stall_ticks                 = 20      # Consecutive no-motion ticks to declare a stall (~200 ms at 10 ms/tick)
button_debounce_ticks       = 5       # Ticks button must be stable before registering a press (~50 ms)
invert_direction            = false   # Flip encoder↔open/close mapping
loop_period_ms              = 10      # Control loop tick interval
calibration_timeout_ticks   = 3_000   # 30 s timeout expressed in ticks (10 ms each)
calibration_pause_ticks     = 20      # 200 ms pause between directions
calibration_stall_ticks     = 80      # Consecutive no-motion ticks to declare a stall (~800 ms at 10 ms/tick)
